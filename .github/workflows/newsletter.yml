name: Send Daily Newsletter

on:
  schedule:
    # Runs at 8:05 AM Eastern, Monday through Friday. GitHub added a `timezone`
    # field to cron in March 2026 — this handles the EST/EDT switch
    # automatically, so no more manually converting to UTC by hand.
    #
    # Also offset 5 minutes past the hour on purpose: GitHub's own docs warn
    # that scheduled workflows are most likely to be delayed right at the top
    # of the hour, since that's when Actions load peaks across all of GitHub.
    # A few minutes' offset avoids that specific congestion window.
    #
    # Actual US market holidays (Thanksgiving, Christmas, etc.) are still
    # filtered out inside newsletter.py itself, since cron has no concept of
    # holidays.
    - cron: '5 8 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch: {}  # lets you manually trigger a run from the GitHub Actions tab, for testing

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r newsletter_requirements.txt

      - name: Run newsletter script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python newsletter.py
