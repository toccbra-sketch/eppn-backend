name: Send Daily Newsletter

on:
  schedule:
    # Runs at 5:05 AM Eastern, Monday through Friday, targeting an ~8am actual
    # delivery given the ~3hr average delay we've observed from GitHub Actions'
    # scheduler. This is a stopgap, not a real fix — the delay isn't a fixed
    # offset and will vary day to day. If consistent delivery timing matters,
    # the actual reliable fix is triggering this workflow from an external
    # scheduler (e.g. cron-job.org hitting the workflow_dispatch REST API)
    # instead of relying on GitHub's own `schedule:` trigger at all.
    #
    # Still offset a few minutes past the hour — GitHub's docs flag the top
    # of the hour as the highest-congestion window for scheduled runs.
    #
    # Actual US market holidays (Thanksgiving, Christmas, etc.) are still
    # filtered out inside newsletter.py itself, since cron has no concept of
    # holidays.
    - cron: '5 5 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch: {}  # lets you manually trigger a run from the GitHub Actions tab, for testing

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r newsletter_requirements.txt

      - name: Run newsletter script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python newsletter.py
